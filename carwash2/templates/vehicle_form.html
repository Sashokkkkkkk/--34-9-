{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h2>{{ title }}</h2>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Владелец *</label>
                    <select name="клиент_id" class="form-select" required>
                        <option value="">Выберите клиента</option>
                        {% for c in clients %}
                        <option value="{{ c.id }}"
                            {% if vehicle and vehicle.клиент_id == c.id %}selected{% endif %}>
                            {{ c.фио }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Марка *</label>
                    <input type="text" name="марка" class="form-control"
                           value="{{ vehicle.марка if vehicle else '' }}"
                           placeholder="Toyota, BMW, Kia..." required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Модель</label>
                    <input type="text" name="модель" class="form-control"
                           value="{{ vehicle.модель if vehicle else '' }}"
                           placeholder="Camry, X5, Sportage...">
                </div>
                <div class="mb-3">
                    <label class="form-label">Государственный номер *</label>
                    <input type="text" name="госномер" class="form-control"
                           value="{{ vehicle.госномер if vehicle else '' }}"
                           placeholder="А123ВС 777" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Цвет</label>
                    <input type="text" name="цвет" class="form-control"
                           value="{{ vehicle.цвет if vehicle else '' }}"
                           placeholder="чёрный, белый, серый...">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">💾 Сохранить</button>
                    <a href="{{ url_for('vehicles') }}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
