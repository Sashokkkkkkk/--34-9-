{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h2>{{ title }}</h2>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Название *</label>
                    <input type="text" name="название" class="form-control"
                           value="{{ service.название if service else '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Цена (₽) *</label>
                    <input type="number" step="0.01" min="0" name="цена" class="form-control"
                           value="{{ service.цена if service else '' }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Категория</label>
                    <input type="text" name="категория" class="form-control"
                           value="{{ service.категория if service else '' }}"
                           placeholder="кузов, салон, доп, комплекс...">
                </div>
                <div class="mb-4">
                    <label class="form-label">Время выполнения (мин) *</label>
                    <input type="number" min="1" name="время_мин" class="form-control"
                           value="{{ service.время_мин if service else 30 }}" required>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">💾 Сохранить</button>
                    <a href="{{ url_for('services') }}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
