{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h2>{{ title }}</h2>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Телефон *</label>
                    <input type="text" name="телефон" class="form-control"
                           value="{{ client.телефон if client else '' }}"
                           placeholder="+79001234567" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">ФИО *</label>
                    <input type="text" name="фио" class="form-control"
                           value="{{ client.фио if client else '' }}"
                           placeholder="Фамилия Имя Отчество" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Скидка (%)</label>
                    <input type="number" min="0" max="100" name="скидка_процент" class="form-control"
                           value="{{ client.скидка_процент if client else 0 }}">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">💾 Сохранить</button>
                    <a href="{{ url_for('clients') }}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
