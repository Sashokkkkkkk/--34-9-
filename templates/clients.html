{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between">
    <h2>Клиенты</h2>
    <a href="{{ url_for('client_new') }}" class="btn btn-primary">➕ Добавить</a>
</div>
<table class="table table-striped mt-3">
    <thead><tr><th>ID</th><th>Телефон</th><th>ФИО</th><th>Скидка %</th><th>Действия</th></tr></thead>
    <tbody>
    {% for c in clients %}
    <tr>
        <td>{{ c.id }}</td><td>{{ c.телефон }}</td><td>{{ c.фио }}</td><td>{{ c.скидка_процент }}</td>
        <td>
            <a href="{{ url_for('client_edit', id=c.id) }}" class="btn btn-sm btn-warning">✏️</a>
            <a href="{{ url_for('client_delete', id=c.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Удалить клиента?')">❌</a>
         </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
