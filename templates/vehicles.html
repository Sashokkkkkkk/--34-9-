{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between">
    <h2>Автомобили</h2>
    <a href="{{ url_for('vehicle_new') }}" class="btn btn-primary">➕ Добавить</a>
</div>
<table class="table table-striped mt-3">
    <thead><tr><th>ID</th><th>Владелец</th><th>Марка</th><th>Модель</th><th>Госномер</th><th>Цвет</th><th>Действия</th></tr></thead>
    <tbody>
    {% for v in vehicles %}
    <tr>
        <td>{{ v.id }}</td><td>{{ v.владелец }}</td><td>{{ v.марка }}</td><td>{{ v.модель or '' }}</td>
        <td>{{ v.госномер }}</td><td>{{ v.цвет or '' }}</td>
        <td>
            <a href="{{ url_for('vehicle_edit', id=v.id) }}" class="btn btn-sm btn-warning">✏️</a>
            <a href="{{ url_for('vehicle_delete', id=v.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Удалить автомобиль?')">❌</a>
         </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
