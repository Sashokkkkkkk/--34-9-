{% extends "base.html" %}
{% block content %}
<h2>{{ title }}</h2>
<form method="post">
    <div class="mb-3"><label>Название</label><input type="text" name="название" class="form-control" value="{{ service.название if service else '' }}" required></div>
    <div class="mb-3"><label>Цена (₽)</label><input type="number" step="0.01" name="цена" class="form-control" value="{{ service.цена if service else '' }}" required></div>
    <div class="mb-3"><label>Категория</label><input type="text" name="категория" class="form-control" value="{{ service.категория if service else '' }}"></div>
    <div class="mb-3"><label>Время (минут)</label><input type="number" name="время_мин" class="form-control" value="{{ service.время_мин if service else 30 }}" required></div>
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{{ url_for('services') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
