{% extends "base.html" %}
{% block content %}
<h2>Редактировать заказ #{{ order.id }}</h2>
<form method="post">
    <div class="mb-3"><label>Статус</label><select name="статус" class="form-select">
        <option {% if order.статус == 'Новый' %}selected{% endif %}>Новый</option>
        <option {% if order.статус == 'В работе' %}selected{% endif %}>В работе</option>
        <option {% if order.статус == 'Запланировано' %}selected{% endif %}>Запланировано</option>
        <option {% if order.статус == 'Готов' %}selected{% endif %}>Готов</option>
    </select></div>
    <div class="mb-3"><label>Оплачено (₽)</label><input type="number" step="0.01" name="оплачено" class="form-control" value="{{ order.оплачено }}"></div>
    <div class="mb-3"><label>Способ оплаты</label><input type="text" name="способ_оплаты" class="form-control" value="{{ order.способ_оплаты or '' }}"></div>
    <div class="mb-3"><label>Планируемая дата</label><input type="datetime-local" name="планируемая_дата" class="form-control" value="{{ order.планируемая_дата[:16] if order.планируемая_дата else '' }}"></div>
    <div class="mb-3"><label>Комментарий</label><textarea name="комментарий" class="form-control">{{ order.комментарий or '' }}</textarea></div>
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{{ url_for('order_detail', id=order.id) }}" class="btn btn-secondary">Назад</a>
</form>
{% endblock %}
