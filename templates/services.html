{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between">
    <h2>Услуги</h2>
    <a href="{{ url_for('service_new') }}" class="btn btn-primary">➕ Добавить</a>
</div>
<table class="table table-striped mt-3">
    <thead>
        <tr><th>ID</th><th>Название</th><th>Цена</th><th>Категория</th><th>Время (мин)</th><th>Действия</th></tr>
    </thead>
    <tbody>
    {% for s in services %}
    <tr>
        <td>{{ s.id }}</td><td>{{ s.название }}</td><td>{{ s.цена }}</td>
        <td>{{ s.категория or '' }}</td><td>{{ s.время_мин }}</td>
        <td>
            <a href="{{ url_for('service_edit', id=s.id) }}" class="btn btn-sm btn-warning">✏️</a>
            <a href="{{ url_for('service_delete', id=s.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Удалить?')">❌</a>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
